[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riden-mcp"
version = "0.1.0"
description = "MCP server that lets agents read and control RIDEN power supplies through riden-cored"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
riden-mcp = "riden_mcp.server:main"
